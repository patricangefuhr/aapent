<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F3F6F1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0C120F" media="(prefers-color-scheme: dark)">
  <title>Åpent</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2312A150'/%3E%3Cpath d='M32 13c-8 0-14.5 6.2-14.5 14C17.5 37 32 51 32 51s14.5-14 14.5-24c0-7.8-6.5-14-14.5-14z' fill='white'/%3E%3Ccircle cx='32' cy='27' r='6.5' fill='%230E7A40'/%3E%3C/svg%3E">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="preload" href="./fonts/schibsted-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="topbar">
    <span class="logo" aria-hidden="true">
      <svg viewBox="0 0 64 64" width="56" height="56">
        <defs>
          <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#2BB768"/><stop offset="1" stop-color="#0C7239"/>
          </linearGradient>
        </defs>
        <rect x="3" y="3" width="58" height="58" rx="17" fill="url(#lg)"/>
        <path d="M3 20A17 17 0 0 1 20 3h24a17 17 0 0 1 17 17Z" fill="#fff" opacity=".13"/>
        <circle cx="32" cy="27" r="17" fill="none" stroke="#fff" stroke-width="2" opacity=".28"/>
        <path d="M32 14c-7.7 0-14 6-14 13.6C18 37.4 32 51 32 51s14-13.6 14-23.4C46 20 39.7 14 32 14z" fill="#fff"/>
        <circle cx="32" cy="27.4" r="6.2" fill="#0C7239"/>
      </svg>
    </span>
    <h1 class="wordmark">Åpent</h1>
    <button class="loc-pill" id="loc-pill">
      <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 21s7-6.3 7-11a7 7 0 1 0-14 0c0 4.7 7 11 7 11Z"/><circle cx="12" cy="10" r="2.5"/></svg>
      <span class="txt" id="loc">…</span>
    </button>
  </header>

  <div class="controls">
    <div class="segmented" id="segmented" style="--seg:2">
      <span class="seg-indicator"></span>
      <button class="seg" data-filter="all">Alle</button>
      <button class="seg" data-filter="open">Åpent nå</button>
      <button class="seg active" data-filter="sunday">Søndagsåpent</button>
    </div>
  </div>

  <div class="mapwrap">
    <div id="map" class="map map-disabled"></div>
    <div class="map-legend" id="map-legend" hidden>
      <span><i style="background:var(--open)"></i>Åpen</span>
      <span><i style="background:var(--unknown)"></i>Ukjent</span>
    </div>
    <button class="map-btn" id="recenter" aria-label="Sentrer på min posisjon" hidden>
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>
    </button>
  </div>
  <p class="map-note">Kart aktiveres når MapKit JS-nøkkel er satt</p>

  <div class="list-head">
    <span class="count"><b id="count">0</b> butikker</span>
    <div class="travel-toggle" role="group" aria-label="Reisemåte">
      <button class="tmode" data-mode="walk" aria-label="Gå">🚶</button>
      <button class="tmode" data-mode="drive" aria-label="Kjør">🚗</button>
    </div>
  </div>
  <p class="sunday-hint" id="sunday-hint"></p>
  <main id="list" class="list" aria-live="polite"></main>

  <div id="detail" class="detail">
    <div id="detail-backdrop" class="detail-backdrop"></div>
    <section class="sheet" role="dialog" aria-modal="true" aria-label="Butikkdetaljer">
      <div class="grabber"></div>
      <div id="detail-body"></div>
    </section>
  </div>

  <div id="report" class="detail">
    <div id="report-backdrop" class="detail-backdrop"></div>
    <section class="sheet report-sheet" role="dialog" aria-modal="true" aria-label="Rapporter feil åpningstid">
      <div id="report-grabber" class="grabber"></div>
      <h2 class="report-title">Rapporter feil åpningstid</h2>
      <div id="report-body"></div>
    </section>
  </div>

  <footer class="attribution">Data © OpenStreetMap-bidragsytere (ODbL) · Kart via Apple Maps</footer>

  <script src="./config.js"></script>
  <script type="module" src="./app.bundle.js"></script>
</body>
</html>
