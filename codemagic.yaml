# Codemagic — bygg Åpent (iOS) og last opp til TestFlight.
# Web-app (public/) pakkes i et Capacitor/WKWebView-skall og bygges som .ipa.
workflows:
  ios-apent:
    name: Åpent – iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      # Navn på App Store Connect-nøkkelen i Codemagic (eksakt, kopiert fra integrasjonen).
      app_store_connect: "Åpent"
    environment:
      groups:
        # Må finnes i Codemagic UI og inneholde CERTIFICATE_PRIVATE_KEY (privat RSA-nøkkel
        # som sertifikatet lages med — uten den kan ikke CI lagre cert eller lage profil).
        - apent_signing
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "no.apent.app"
      node: 22
      xcode: latest
    scripts:
      - name: Installer avhengigheter
        script: npm install --no-audit --no-fund
      - name: Bygg web-assets + synk til iOS
        script: |
          npm run build:web
          npx cap copy ios
      - name: Sett opp signering (cert + profil)
        script: |
          keychain initialize
          # Hent/lag distribusjonssertifikat + app_store-profil for bundle id.
          # Nøkkelen gjør at cert kan lagres og gjenbrukes på tvers av builds.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key=@env:CERTIFICATE_PRIVATE_KEY
          keychain add-certificates
          xcode-project use-profiles
          # Hard sjekk: stopp HER med tydelig feil hvis ingen profil ble lagd,
          # i stedet for kryptisk "requires a provisioning profile" i archive-steget.
          ls "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision
      - name: Bygg .ipa
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Interne testere kan installere med en gang builden er prosessert (ingen review).
