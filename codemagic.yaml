# Codemagic — bygg Åpent (iOS) og last opp til TestFlight.
# Web-app (public/) pakkes i et Capacitor/WKWebView-skall og bygges som .ipa.
workflows:
  ios-apent:
    name: Åpent – iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      # Navn på App Store Connect-nøkkelen i Codemagic (eksakt, kopiert fra integrasjonen).
      app_store_connect: "Åpent"
    environment:
      groups:
        # Må finnes i Codemagic UI og inneholde CERT_KEY_B64 (privat RSA-nøkkel som
        # ÉN base64-linje — dekodes i signeringssteget; tåler kopiering/liming trygt).
        - apent_signing
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "no.apent.app"
      node: 22
      xcode: latest
    scripts:
      - name: Installer avhengigheter
        script: npm install --no-audit --no-fund
      - name: Bygg web-assets + synk til iOS
        script: |
          npm run build:web
          npx cap copy ios
      - name: Sett opp signering (cert + profil)
        script: |
          keychain initialize
          # Dekod privatnøkkelen fra én base64-linje til PEM-fil, og valider den
          # FØR vi bruker den — så feil i env-variabelen gir en klar melding her.
          echo "$CERT_KEY_B64" | base64 --decode > "$HOME/cert_key"
          if ! grep -q "BEGIN RSA PRIVATE KEY" "$HOME/cert_key"; then
            echo "FEIL: CERT_KEY_B64 dekodet ikke til en gyldig PEM-nøkkel."
            echo "Sjekk at variabelen er limt inn som ÉN sammenhengende linje."
            exit 1
          fi
          # Hent/lag distribusjonssertifikat + app_store-profil for bundle id.
          # Samme nøkkel hver build -> sertifikatet gjenbrukes (lager ikke nye).
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key=@file:$HOME/cert_key
          keychain add-certificates
          xcode-project use-profiles
          # Hard sjekk: stopp HER med tydelig feil hvis ingen profil ble lagd,
          # i stedet for kryptisk "requires a provisioning profile" i archive-steget.
          # (Xcode 16+ lagrer profiler under Xcode/UserData, eldre under MobileDevice.)
          if ! ls "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/"*.mobileprovision \
                  "$HOME/Library/MobileDevice/Provisioning Profiles/"*.mobileprovision 2>/dev/null | grep -q .; then
            echo "FEIL: ingen provisioning-profil ble lagret."
            exit 1
          fi
      - name: Bygg .ipa
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Interne testere kan installere med en gang builden er prosessert (ingen review).
