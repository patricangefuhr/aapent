<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#F3F6F1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0C120F" media="(prefers-color-scheme: dark)">
  <title>Åpent</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2312A150'/%3E%3Cpath d='M32 13c-8 0-14.5 6.2-14.5 14C17.5 37 32 51 32 51s14.5-14 14.5-24c0-7.8-6.5-14-14.5-14z' fill='white'/%3E%3Ccircle cx='32' cy='27' r='6.5' fill='%230E7A40'/%3E%3C/svg%3E">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="preload" href="./fonts/schibsted-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="./styles.css?v=b505b83">
</head>
<body>
  <!-- Kart som hovedflate -->
  <div id="map" class="map"></div>
  <div class="map-fallback" id="map-fallback" hidden>Kart utilgjengelig</div>

  <!-- Flytende topp: logo + navn + filterchips -->
  <div class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 64 64" width="34" height="34">
          <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2BB768"/><stop offset="1" stop-color="#0C7239"/></linearGradient></defs>
          <rect x="3" y="3" width="58" height="58" rx="17" fill="url(#lg)"/>
          <path d="M3 20A17 17 0 0 1 20 3h24a17 17 0 0 1 17 17Z" fill="#fff" opacity=".13"/>
          <path d="M32 14c-7.7 0-14 6-14 13.6C18 37.4 32 51 32 51s14-13.6 14-23.4C46 20 39.7 14 32 14z" fill="#fff"/>
          <circle cx="32" cy="27.4" r="6.2" fill="#0C7239"/>
        </svg>
      </span>
      <span class="wordmark">Åpent</span>
    </div>
    <div class="chips" id="chips">
      <div class="chip-row">
        <button class="chip filter" data-filter="open">Åpent nå</button>
        <button class="chip filter" data-filter="sunday">Søndagsåpent</button>
        <button class="chip filter" data-filter="offers">Tilbud</button>
      </div>
      <div class="chip-row">
        <button class="chip tmode" data-mode="walk">🚶 Gå</button>
        <button class="chip tmode" data-mode="drive">🚗 Kjør</button>
      </div>
    </div>
  </div>

  <!-- Finn meg -->
  <button id="recenter" class="fab" aria-label="Finn meg">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3.5"/><path d="M12 2v3.5M12 18.5V22M2 12h3.5M18.5 12H22"/></svg>
  </button>

  <!-- Skygge bak arket når det er helt oppe -->
  <div id="sheet-scrim" class="sheet-scrim" hidden></div>

  <!-- Bunnark: butikkliste -->
  <section id="sheet" class="sheet-bottom" data-snap="peek">
    <button class="sheet-grab" id="sheet-grab" aria-label="Dra for å utvide listen"><span></span></button>
    <div class="sheet-head">
      <span class="count"><b id="count">0</b> butikker <span class="hint" id="sunday-hint"></span></span>
      <button class="loc-pill" id="loc-pill">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 21s7-6.3 7-11a7 7 0 1 0-14 0c0 4.7 7 11 7 11Z"/><circle cx="12" cy="10" r="2.5"/></svg>
        <span class="txt" id="loc">…</span>
      </button>
    </div>
    <div id="list" class="list" aria-live="polite"></div>
    <p class="attribution">Data © OpenStreetMap-bidragsytere (ODbL) · Tilbud via eTilbudsavis · Kart: Apple</p>
  </section>

  <!-- Detalj -->
  <div id="detail" class="detail">
    <div id="detail-backdrop" class="detail-backdrop"></div>
    <section class="sheet" role="dialog" aria-modal="true" aria-label="Butikkdetaljer" tabindex="-1">
      <div class="grabber"></div>
      <button class="sheet-close" data-close="detail" aria-label="Lukk">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <div id="detail-body"></div>
    </section>
  </div>

  <!-- Rapport -->
  <div id="report" class="detail">
    <div id="report-backdrop" class="detail-backdrop"></div>
    <section class="sheet report-sheet" role="dialog" aria-modal="true" aria-label="Rapporter feil åpningstid" tabindex="-1">
      <div id="report-grabber" class="grabber"></div>
      <button class="sheet-close" data-close="report" aria-label="Lukk">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <h2 class="report-title">Rapporter feil åpningstid</h2>
      <div id="report-body"></div>
    </section>
  </div>

  <!-- Snackbar / toast -->
  <div id="toasts" class="toasts" aria-live="polite" aria-atomic="false"></div>

  <script src="./config.js?v=b505b83"></script>
  <script type="module" src="./app.bundle.js?v=b505b83"></script>
</body>
</html>
